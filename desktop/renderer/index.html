<!doctype html>
<html lang="en">
<head>

<title>Bullpen Command</title>
<link rel="stylesheet" href="css/tokens.css">

<body>
<div id="app" data-page="empty">
  <header id="titlebar">
    <button type="button" class="ib" id="tglSidebar" title="Toggle sidebar (⌥⌘S)" aria-label="Toggle sidebar">◧</button>
    <div id="tbTitle"></div>
    <div id="tbCenter"></div>
    <div id="tbRight"></div>
    <button type="button" class="ib" id="tglInspector" title="Toggle inspector (⌥⌘I)" aria-label="Toggle inspector">◨</button>
  </header>
  <div id="main">
    <aside id="sidebar"><div class="inner"></div></aside>
    <main id="center"></main>
    <aside id="inspector" aria-label="Inspector"><div class="inner"></div></aside>
  </div>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" hidden></div>
